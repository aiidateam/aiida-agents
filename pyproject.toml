[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiida-agents"
dynamic = ["version"]
description = 'Natural-language, multi-agent interface to AiiDA (alpha, work in progress).'
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["aiida", "agents", "llm", "mcp", "rag", "workflows", "natural-language"]
authors = [{ name = "Jaweria Batool" }, { name = "The AiiDA Team" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Floored at a PyPI release now that 2.9.0 is out, with reproducibility
    # coming from uv.lock (the same approach as `click` below). This replaces
    # the earlier pin to commit c91007e: tracking aiida-core's default branch
    # had broken every build the day it bumped to 3.0.dev (`aiida-pseudo~=1.8`
    # caps at `aiida-core<3.dev0`, so the two became unresolvable), and a fixed
    # commit was the stopgap until a release we could floor against existed.
    #
    # 2.9 rather than 2.8: `verdi profile setup` gained `--broker` after the
    # v2.8.0 tag, and `sandbox init` generates a command that uses it, so the
    # floor has to be the release that carries it. Capped below 3.0 (`~=2.9`):
    # aiida-core's 3.0 line is the known breaker (`aiida-pseudo~=1.8` refuses
    # `aiida-core>=3.dev0`), and that cap lives only in the `tests` extra, so an
    # unbounded floor could pull a 3.0 into the base install that CI never
    # exercises. Within 2.x, uv.lock still pins the exact version.
    "aiida-core~=2.9",
    # Reached only through rich_click (which itself requires click>=8); no
    # speculative upper bound. Reproducibility comes from uv.lock, and a ceiling
    # is added reactively (with the breaking version noted) if CI ever hits one.
    "click>=8",
    "fastmcp>=3.0.0",
    "prompt-toolkit>=3",
    # Resolves the per-user data directory the RAG vector store defaults to,
    # correctly across macOS/Windows/XDG. Tiny and dependency-free; a core
    # dependency because RagSettings is read outside the optional `rag` extra.
    "platformdirs>=4",
    "pydantic-ai-slim[openai,anthropic]>=0.1",
    "pydantic-settings>=2.14.1",
    "rich>=13",
    "rich-click>=1.7",
    "typing-extensions>=4.12",
    "uvicorn>=0.33",
]

[project.scripts]
aiida-agents = "aiida_agents.cli:cli"

[project.optional-dependencies]
docs = [
  "mystmd"
]
# The vector store, plus the sphinx toolchain `rag build` shells out to
# (rag._textbuild renders the corpus). Both, because no index ships prebuilt:
# whoever installs this extra has to run `rag build` before a query works.
rag = [
  "chromadb>=1.5.9",
  # No specifier: the base `aiida-core~=2.9` dependency above already carries
  # the version policy (and the reasoning for it); this only adds the extra.
  "aiida-core[docs]",
]
# In-process CPU fallback embedder, used only when no Ollama server is reachable.
# (The default `rag` extra is already local: it embeds via the local Ollama
# daemon.) Heavy: pulls torch and on PyPI its CUDA wheel stack, so it is opt-in.
rag-fallback = [
  "aiida-agents[rag]",
  "sentence-transformers>=5.5.1",
]
# Structure-file parsing for `import_structure` (CIF/POSCAR/xyz -> StructureData).
# Opt-in: only needed to bring a structure in from disk, not to run a workflow
# on one already in the profile. Just ASE, which is all the tool imports --
# aiida-core's `atomic-tools` extra would also pull pymatgen/spglib/seekpath
# for no use here. The specifier matches aiida-core's own (`ase~=3.21`) so the
# two never resolve against each other.
structures = [
  "ase~=3.21",
]
tests = [
  "pytest",
  "pytest-cov",
  # So CI actually exercises import_structure's parse path rather than
  # skipping it; the tests skip cleanly when it is absent.
  "aiida-agents[structures]",
  # check_input_ranges compares against a pseudopotential family's published
  # cutoffs. The source needs nothing from aiida-pseudo -- it reads the family
  # through AiiDA's group API -- but the tests build a real family to compare
  # against, rather than mocking away the one part worth doubting. A test
  # dependency only, so the package itself stays code-agnostic.
  "aiida-pseudo~=1.8",
  # Scores the answer-quality eval tier (Dataset/Case/LLMJudge). An extra
  # rather than a dev-group entry because the `tests` extra is what CI's
  # hatch-test and pre-commit environments install; in the dev group the
  # answer-quality module would fail to import there, and the mypy hook with
  # it.
  "pydantic-evals>=0.1",
]
lint = [
  "mypy",
  "ruff",
  "types-docutils"  # stubs for docutils, imported by rag._textbuild
]
pre-commit = [
  "pre-commit",
  "aiida-agents[lint]"
]

[dependency-groups]
dev = [
  "aiida-agents[docs,tests,rag,pre-commit]",
  "pytest-asyncio>=1.4.0",
]
# Everything needed to exercise the agents against a real Quantum ESPRESSO
# setup: the plugin whose workflows and docs the execution agent drives, and
# the dev-only stub that registers those docs as a RAG corpus (upstream does
# not ship the aiida_agents.plugins entry point yet).
#
# A *group* rather than an extra, deliberately: this is local development only
# and must not be published in the package's metadata. It exists because
# `uv sync` makes the environment match uv.lock exactly, so anything installed
# ad hoc -- as these were -- is silently removed on the next sync, taking every
# quantumespresso.* entry point with it. `uv sync --group qe` keeps them.
qe = [
  "aiida-quantumespresso~=5.0",
  "aiida-pseudo~=1.8",
  "qe-rag-stub",
]

# The same arrangement for VASP, and a group of its own so a QE-only setup does
# not pay for it. Nothing in the tool layer is plugin-specific -- installing
# aiida-vasp registers its entry points, and list_workflows/describe_workflow/
# build_workflow_inputs read them like any other -- so what this group really
# adds is the documentation corpus, without which an agent can discover a
# VaspRelaxWorkChain's ports but not what any of them mean.
#
# No pseudopotential package here, deliberately: VASP's POTCARs are licensed
# and cannot be distributed, so a working setup supplies them out of band.
vasp = [
  "aiida-vasp~=5.1",
  "vasp-rag-stub",
]

[tool.uv.sources]
# The stubs live in this repository; installing them editable means a change to
# dev/*_rag_stub takes effect without reinstalling.
qe-rag-stub = { path = "dev/qe_rag_stub", editable = true }
vasp-rag-stub = { path = "dev/vasp_rag_stub", editable = true }

[tool.hatch.version]
path = "src/aiida_agents/__about__.py"

[tool.hatch.envs.default]
installer = 'uv'
scripts.bump = [
  "hatch version {args}",
  "python dev/update_changelog.py",
]

[tool.hatch.envs.docs]
features = ["docs"]
scripts.build = "cd docs && myst build"
scripts.serve = "cd docs && myst start"

[tool.hatch.envs.pre-commit]
# `tests` is included so the mypy hook (which now type-checks `tests/`) has
# pytest and the test deps available.
features = ["pre-commit", "tests", "rag"]
scripts.install = "pre-commit install"
scripts.run = "pre-commit run {args}"

[tool.hatch.envs.hatch-test]
features = ["tests", "rag"]
randomize = false
parallel = false

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.coverage.run]
source = ["aiida_agents"]
branch = true

[tool.coverage.report]
show_missing = true
# Floor, not a target: a gate against big regressions. Aim high on the
# deterministic logic; the LLM/agent IO boundaries are `# pragma: no cover`
# rather than chased with mock-to-hit-lines tests.
fail_under = 80

[tool.ruff]
exclude = [
    ".aiida_agents_vector_db",
]
# Ruff's defaults (E/F) plus T20: no bare ``print()`` in the package; user-facing
# output goes through ``click.echo`` / ``console.print``. The carve-outs below are
# staged for a later pass that broadens the selection to their families.
lint.extend-select = ["T20"]
lint.ignore = [
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "EM101",   # https://docs.astral.sh/ruff/rules/raw-string-in-exception/
    "EM102",   # https://docs.astral.sh/ruff/rules/f-string-in-exception/
    "PLR2004", # https://docs.astral.sh/ruff/rules/magic-value-comparison/
    "FBT002",  # https://docs.astral.sh/ruff/rules/boolean-default-value-positional-argument/
    "TID252",  # https://docs.astral.sh/ruff/rules/relative-imports/
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["INP001", "S101"]
"dev/**/*.py" = ["INP001", "T201"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
mypy_path = "src"
explicit_package_bases = true
# Respect per-module ``follow_imports`` even for ``.pyi`` stubs (needed by the
# numpy override below).
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# numpy >= 2.5 ships PEP 695 ``type`` statements in its stubs, which mypy cannot
# parse while we target python_version 3.10 (our minimum). We never use numpy's
# types directly, so skip its stubs instead of bumping the whole target to 3.12.
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# aiida-pseudo ships no ``py.typed``, and only the tests import it directly.
module = ["aiida_pseudo.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The dev stubs under ``dev/`` are installed only by their own dependency group
# (``uv sync --group qe`` / ``--group vasp``), so they are absent wherever those
# groups are not synced -- CI included. Their tests skip at runtime via
# ``importorskip``, but mypy resolves the import regardless and would fail the
# lint job on a package it was never meant to need. Both ship ``py.typed``, so
# where they *are* installed they are still checked normally; this only stops
# their absence from being an error.
module = ["qe_rag_stub.*", "vasp_rag_stub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# AiiDA's ORM is only partially typed (``orm.Int()``, ``append_atom()``, ...),
# so strict mypy flags every ORM call in the tests as ``no-untyped-call``. That
# is AiiDA's gap, not ours, and a per-call ``# type: ignore`` is unsustainable.
# Disable just that check for the tests; everything else stays strict.
module = "tests.*"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# sentence-transformers is an optional dependency (the `rag-fallback` extra) and is
# imported lazily, so it is absent from the default lint/test env. Don't fail on
# the missing import; it also ships no type stubs.
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sphinx is an indexing-only dependency: rag._textbuild imports it lazily (see
# indexing._clone_and_build_text). The `rag` extra ships it, so the lint env
# (which installs that extra) sees its real types; the override is what keeps
# mypy usable in an environment that installed the package without the extra.
module = ["sphinx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# rag._textbuild subclasses sphinx's TextTranslator and returns app.statuscode.
# Wherever sphinx is missing (an environment without the `rag` extra, above)
# both resolve to Any, so relax the Any-subclass and Any-return checks for this
# one module. With sphinx installed, as in the lint env, they are real types and
# these relaxations are inert (full checking still applies).
module = "aiida_agents.rag._textbuild"
disallow_subclassing_any = false
warn_return_any = false

[tool.pyright]
# Under [tool.pyright] (not [tool.basedpyright]) so both tools read it: vanilla
# pyright (what some editors run) reads only [tool.pyright]; basedpyright reads
# it too. Not run in CI (mypy is the type checker); this just keeps an in-editor
# LSP aligned with the mypy baseline. "standard" mode because basedpyright's
# default "recommended" floods on `Any` from AiiDA's untyped ORM, which mypy
# does not flag.
typeCheckingMode = "standard"
# Resolve imports (including this package's editable install) from the project
# venv, so the LSP resolves third-party and first-party modules instead of
# reporting them unresolved.
venvPath = "."
venv = ".venv"
# The cli/ package deliberately uses `_`-prefixed helpers imported across sibling
# modules (e.g. agent._build_agent, called from commands.py). Pyright treats a
# `_`-name as module-private and does not count a cross-module import as usage,
# so it flags every such helper "not accessed" [reportUnusedFunction]. There is
# no "package-private" notion to make it accurate; genuinely dead code is still
# caught by the coverage gate and ruff.
reportUnusedFunction = "none"

[tool.pytest.ini_options]
markers = [
    # Grounding evals in tests/evals. They hit a real model provider and need a
    # built RAG index, so they are gated on AIIDA_AGENTS_EVAL=1 as well and are
    # never part of a CI run. See tests/evals/test_grounding.py.
    "llm: exercises a real model provider; opt-in, excluded from CI",
]
# Warnings raised by our own code are errors; third-party warnings only show.
# A blanket `error` is unworkable here: AiiDA's dependency tree emits
# version-specific deprecations across the 3.10-3.14 matrix (aiida-core itself
# curates ~30 ignores and never errors), so scoping `error` to our package
# avoids that treadmill while still failing on warnings we introduce. The
# ignores below just quiet the loudest known third-party noise.
filterwarnings = [
    "error:::aiida_agents",
    "ignore::ResourceWarning",
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore:Creating AiiDA configuration folder:UserWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

