[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vasp-rag-stub"
version = "0.0.0"
description = "Dev-only local stub that registers an aiida-vasp RAG corpus, so aiida-agents' plugin RAG extensibility (search_aiida_docs cross-corpus attribution) can be exercised against a second real corpus without aiida-vasp itself shipping the real aiida_agents.plugins entry point yet. Not for distribution."
requires-python = ">=3.10"
dependencies = ["aiida-agents"]

[project.entry-points."aiida_agents.plugins"]
vasp = "vasp_rag_stub:PROVIDER"

[tool.hatch.build.targets.wheel]
packages = ["vasp_rag_stub"]
